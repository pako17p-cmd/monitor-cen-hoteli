name: Check hotel prices

on:
  schedule:
    # Avoid the top of the hour, when GitHub schedule queues are busiest.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotel-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium --only-shell

      - name: Test Rainbow airport parsing
        env:
          DISABLE_SCHEDULER: "1"
          DB_PATH: ${{ runner.temp }}/hotel-regression.db
        run: python -m unittest discover -s tests -p "test_rainbow_airports.py" -v

      - name: Read prices and save history
        env:
          DISABLE_SCHEDULER: "1"
          DB_PATH: ${{ runner.temp }}/hotel-history.db
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HISTORY_BRANCH: price-history
        run: python check_prices.py

