services:
  - type: web
    name: monitor-cen-hoteli
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    disk:
      name: monitor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/history.db
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
